appId: com.stockflow.desktop
productName: StockFlow
copyright: Copyright 2026 StockFlow

directories:
  output: dist
  buildResources: build

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - node_modules/**
  - "!node_modules/vite/**"
  - "!node_modules/electron-vite/**"
  - "!node_modules/@vitejs/**"
  - "!node_modules/@tailwindcss/**"
  - "!node_modules/tailwindcss/**"
  - "!node_modules/typescript/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/rollup/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@types/**"
  - "!node_modules/.cache/**"
  - "!src/**"
  - "!electron/**"
  - "!public/**"
  - "!scripts/**"
  - "!*.config.*"

extraResources:
  - from: public/icon.png
    to: icon.png

asar: true

publish: null

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: public/icon.png
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  shortcutName: StockFlow
  artifactName: ${productName} Setup.${ext}
  uninstallDisplayName: StockFlow
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true

mac:
  target: dmg
  icon: public/icon.png

linux:
  target: AppImage
  icon: public/icon.png
